name: Public platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://platform:local-ci-only@127.0.0.1:5432/platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm run build
      - run: npm run lint
      - run: npm test
        env:
          TEST_DATABASE_URL: ""
      - run: npm run test:agent
      - run: npm run test:local
      - run: npm run test:authorization
      - run: npm -w @hedgeling/web-console run security:verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:navigation:browser
      - run: npm run test:agent:browser
      - run: npm -w @hedgeling/web-console run test:extraction:browser
      - run: npm run test:commercial:browser
      - run: docker build -f packages/web-console/Dockerfile .
